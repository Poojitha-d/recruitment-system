<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HireAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
    <h2>✨ HireAI</h2>
    <div class="nav-right">
        <a href="{{ url_for('home') }}">🏠 Home</a>
        <a href="{{ url_for('register') }}">📝 Register</a>
    </div>
</div>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for msg in messages %}
            <div class="alert {% if 'success' in msg.lower() or 'registered' in msg.lower() %}alert-success{% else %}alert-error{% endif %}">
                {{ msg }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<div class="container-single">
    <div class="box">
        <h3 style="justify-content: center; font-size: 1.4rem; margin-bottom: 24px;">🔑 Portal Login</h3>

        <form method="post" action="{{ url_for('login') }}">
            <label for="role">Select Role</label>
            <select name="role" id="role" required>
                <option value="candidate">Candidate (Job Seeker)</option>
                <option value="company">Company (Recruiter)</option>
                <option value="interviewer">Interviewer</option>
            </select>

            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="e.g. john_doe" required autofocus>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your password" required>

            <button type="submit">Log In</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.92rem;">
            <span style="color: var(--text-muted);">Don't have an account?</span>
            <a href="{{ url_for('register') }}" style="color: #a5b4fc; text-decoration: underline; margin-left: 6px;">Register here</a>
        </div>
    </div>
</div>

</body>
</html>
